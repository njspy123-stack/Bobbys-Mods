name: CodeQL Actions
on:
  push:
    branches: [main]
    paths: ['.github/**']
  pull_request:
    branches: [main]
    paths: ['.github/**']
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: actions
      - uses: github/codeql-action/analyze@v4
        with:
          category: hosted/actions
